name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.18', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install the build toolchain
        run: npm install --no-save typescript@^5.8.0 @types/node@^22.7.0

      - name: Build
        run: npm run build

      - name: Run the test suite
        run: node --test

      - name: Lint the reference contract
        run: node bin/apicovenant.mjs lint examples/shop.openapi.yaml

      - name: Type check
        run: npx tsc --noEmit

      - name: Release check
        run: node scripts/release-check.mjs

  self-check:
    name: apicovenant lints its own examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: The reference contract has no findings
        run: |
          node bin/apicovenant.mjs lint examples/shop.openapi.yaml --format json \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const r=JSON.parse(d);if(r.summary.total>0){console.error('the reference contract has '+r.summary.total+' findings');process.exit(1)}})"
      - name: The flawed contract is detected
        run: |
          if node bin/apicovenant.mjs lint examples/legacy.openapi.yaml; then
            echo "the legacy example should not pass the linter" >&2
            exit 1
          fi
      - name: Every rule fires on a fixture
        run: node --test test/rules.test.ts
